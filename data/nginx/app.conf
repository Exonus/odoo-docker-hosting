server {
    listen [::]:443 ssl http2;
    listen 443 ssl http2;

    server_name exonus.tech;
    server_tokens off;


    ssl_certificate /etc/nginx/letsencrypt/live/exonus.tech/fullchain.pem;
    ssl_certificate_key /etc/nginx/letsencrypt/live/exonus.tech/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.exonus.tech$request_uri;
}

server {
    listen [::]:443 ssl http2;
    listen 443 ssl http2;

    server_name exonus.tech;
    server_tokens off;


    ssl_certificate /etc/nginx/letsencrypt/live/exonus.tech/fullchain.pem;
    ssl_certificate_key /etc/nginx/letsencrypt/live/exonus.tech/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    location / {
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_pass http://odoo:8069;
    }

    location ~* /web/static/ {
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_pass http://odoo:8069;
    }
}