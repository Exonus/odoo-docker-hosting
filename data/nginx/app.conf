server {
    listen [::]:80;
    listen 80;
    server_tokens off;

    server_name exonus.tech www.exonus.tech;

    # acme challenge
    # location ^~ /.well-known/acme-challenge/ {
    #     allow all;
    #     root /var/www/certbot;
    # }

    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    # location / {
    #     return 301 https://$host$request_uri;
    # } 

    return 301 https://www.exonus.tech$request_uri;
}

